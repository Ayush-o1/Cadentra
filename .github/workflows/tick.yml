# Optional. For hosts that put idle web services to sleep (for example the free tier on Render), the
# in-process worker stops while the service sleeps. This job wakes the service every five minutes and
# asks it to send whatever is due. It needs two repository secrets and does nothing without them:
#   APP_URL     https://your-app.example.org
#   TICK_TOKEN  the same value as the TICK_TOKEN environment variable on the server
name: Wake and tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
    steps:
      - name: Call the tick endpoint
        run: |
          if [ -z "$APP_URL" ] || [ -z "$TICK_TOKEN" ]; then
            echo "APP_URL and TICK_TOKEN secrets are not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 \
            -X POST -H "Authorization: Bearer $TICK_TOKEN" "$APP_URL/internal/tick"
