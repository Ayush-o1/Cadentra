# Optional. For hosts that put idle web services to sleep (for example the free tier on Render), the
# in-process worker stops while the service sleeps. This job wakes the service once an hour and asks
# it to send whatever is due. It is hourly on purpose: Render's free tier gives each workspace 750
# instance hours a month SHARED by all its free services, and a service pinged every five minutes
# never sleeps (about 744 hours), which would use the whole allowance and get every free service in
# the workspace suspended. Hourly keeps this one awake roughly a quarter of the time. It needs two repository secrets and does nothing without them:
#   APP_URL     https://your-app.example.org
#   TICK_TOKEN  the same value as the TICK_TOKEN environment variable on the server
name: Wake and tick

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
    steps:
      - name: Call the tick endpoint
        run: |
          if [ -z "$APP_URL" ] || [ -z "$TICK_TOKEN" ]; then
            echo "APP_URL and TICK_TOKEN secrets are not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 \
            -X POST -H "Authorization: Bearer $TICK_TOKEN" "$APP_URL/internal/tick"
