name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cadentra_test
          MYSQL_USER: cadentra
          MYSQL_PASSWORD: cadentra
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://cadentra:cadentra@127.0.0.1:3307/cadentra_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test the production build
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" APP_SECRET="$(openssl rand -hex 32)" PORT=3300 node dist/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3300/healthz && break; sleep 1; done
          node scripts/smoke-test.mjs http://localhost:3300
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cadentra
          MYSQL_USER: cadentra
          MYSQL_PASSWORD: cadentra
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cadentra:ci .
      - name: Run the image against MySQL, then smoke test and stop it
        run: |
          docker run -d --name cadentra --network host \
            -e DATABASE_URL=mysql://cadentra:cadentra@127.0.0.1:3306/cadentra \
            -e APP_SECRET="$(openssl rand -hex 32)" \
            -e PORT=3400 cadentra:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3400/healthz && break; sleep 1; done
          node scripts/smoke-test.mjs http://127.0.0.1:3400
          test "$(docker exec cadentra id -u)" != "0"
          docker stop --time 20 cadentra
          test "$(docker inspect -f '{{.State.ExitCode}}' cadentra)" = "0"
      - name: Show container logs on failure
        if: failure()
        run: docker logs cadentra
